name: CI

on:
  push:
    branches: [dev_claude, "dev_claude_**"]
  pull_request:
    branches: [dev_claude]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walls:
    name: Grep walls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/check_walls.py

  linux:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc-debug, linux-clang-release, linux-asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  determinism:
    name: Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            debug: linux-gcc-debug
            release: linux-gcc-release
            exe: ""
          - os: windows-latest
            debug: msvc-debug
            release: msvc-release
            exe: ".exe"
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build Debug and Release
        shell: bash
        run: |
          cmake --preset ${{ matrix.debug }} -DMCE_BUILD_TESTS=OFF
          cmake --build --preset ${{ matrix.debug }} --target sample_02_boids
          cmake --preset ${{ matrix.release }} -DMCE_BUILD_TESTS=OFF
          cmake --build --preset ${{ matrix.release }} --target sample_02_boids
      - name: 3 runs x Debug/Release must hash identically
        shell: bash
        run: >
          python3 scripts/ci/determinism.py --runs 3 --args "-ticks 1000 -boids 20000"
          build/${{ matrix.debug }}/samples/02_boids/sample_02_boids${{ matrix.exe }}
          build/${{ matrix.release }}/samples/02_boids/sample_02_boids${{ matrix.exe }}

  windows:
    name: Windows ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-debug, msvc-release]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
