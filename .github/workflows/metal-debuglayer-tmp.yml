# TEMPORARY (removed before merge): runs the Metal debug-layer checks of PR #1194's metal.yml on this PR, to verify the
# u_volSmplr binding fix (M-METAL-HOSTED open item). MTL_SHADER_VALIDATION stays off: it breaks compute compilation on
# hosted runners.
name: Metal debug layer (temporary)

on:
  pull_request:
    branches: [master]
    paths: [".github/workflows/metal-debuglayer-tmp.yml"]

permissions:
  contents: read

concurrency:
  group: metal-dbg-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metal:
    name: metal-debuglayer
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and ccache
        run: brew install ninja ccache
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-mac-${{ github.sha }}
          restore-keys: ccache-mac-
      - name: Configure (GPU tests on)
        run: >
          cmake --preset macos-release -DMCE_GPU_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset macos-release --target test_golden_gl test_render_gl test_rhi_metal -- -k 0
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-mac-${{ github.sha }}
      - name: Metal checks (MTL_DEBUG_LAYER=1)
        shell: bash
        run: |
          set +e
          B=build/macos-release
          mkdir -p out
          : > out/summary.txt
          run() {  # run <name> <timeout s> <command...>
            local n="$1" t="$2"; shift 2
            echo "=== $n (limit ${t}s): $*"
            "$@" > "out/$n.log" 2>&1 &
            local pid=$! i=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$i" -ge "$t" ]; then echo "TIMEOUT after ${t}s" >> "out/$n.log"; pkill -9 -P "$pid" 2>/dev/null; kill -9 "$pid" 2>/dev/null; break; fi
              sleep 1; i=$((i + 1))
            done
            wait "$pid" 2>/dev/null; local rc=$?
            [ "$i" -ge "$t" ] && rc=124
            tail -n 40 "out/$n.log"
            echo "$n rc=$rc (${i}s)" | tee -a out/summary.txt
          }
          export MTL_DEBUG_LAYER=1
          # Pass 1: the debug layer logs instead of aborting, so one run lists every binding gap.
          export MTL_DEBUG_LAYER_ERROR_MODE=nslog
          run golden_nslog 900 "$B/tests/render_gl/test_golden_gl"
          run render_gl_nslog 3600 "$B/tests/render_gl/test_render_gl"
          # Pass 2: the default (assert) mode, the check the M-METAL-HOSTED workflow runs.
          unset MTL_DEBUG_LAYER_ERROR_MODE
          run golden_debuglayer 900 "$B/tests/render_gl/test_golden_gl"
          run rhi_metal_debuglayer 300 "$B/tests/rhi_metal/test_rhi_metal"
          run render_gl_debuglayer 3600 "$B/tests/render_gl/test_render_gl"
          for f in out/*.log; do
            echo "--- $f"; grep -h "TEST CASE:\|MTLDebug\|missing\|validate\|failed assertion" "$f" | grep -B1 "MTLDebug\|missing\|validate\|failed assertion" | head -80
          done > out/validation.txt
          cat out/validation.txt
          grep -h "MTLDebug\|missing .* binding\|failed assertion" out/*.log | sed 's/^.*\(-\[MTL\)/\1/' | sort | uniq -c | sort -rn | head -40 > out/distinct.txt
          { echo '### Metal debug layer'; echo '```'; cat out/summary.txt; echo; cat out/distinct.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-debuglayer-results
          path: out
          retention-days: 14
