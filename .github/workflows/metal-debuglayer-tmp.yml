# TEMPORARY (removed before merge): runs the Metal debug-layer checks of PR #1194's metal.yml on this PR, to verify the
# u_volSmplr binding fix (M-METAL-HOSTED open item). MTL_SHADER_VALIDATION stays off: it breaks compute compilation on
# hosted runners.
name: Metal debug layer (temporary)

on:
  pull_request:
    branches: [master]
    paths: [".github/workflows/metal-debuglayer-tmp.yml"]

permissions:
  contents: read

concurrency:
  group: metal-dbg-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metal:
    name: metal-debuglayer
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and ccache
        run: brew install ninja ccache
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-mac-${{ github.sha }}
          restore-keys: ccache-mac-
      - name: Configure (GPU tests on)
        run: >
          cmake --preset macos-release -DMCE_GPU_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset macos-release --target test_golden_gl test_render_gl test_rhi_metal -- -k 0
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-mac-${{ github.sha }}
      - name: Metal checks (MTL_DEBUG_LAYER=1)
        shell: bash
        run: |
          set +e
          B=build/macos-release
          mkdir -p out
          : > out/summary.txt
          run() {  # run <name> <timeout s> <command...>
            local n="$1" t="$2"; shift 2
            echo "=== $n (limit ${t}s): $*"
            "$@" > "out/$n.log" 2>&1 &
            local pid=$! i=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$i" -ge "$t" ]; then echo "TIMEOUT after ${t}s" >> "out/$n.log"; pkill -9 -P "$pid" 2>/dev/null; kill -9 "$pid" 2>/dev/null; break; fi
              sleep 1; i=$((i + 1))
            done
            wait "$pid" 2>/dev/null; local rc=$?
            [ "$i" -ge "$t" ] && rc=124
            tail -n 40 "out/$n.log"
            echo "$n rc=$rc (${i}s)" | tee -a out/summary.txt
          }
          # Run 3: which test_render_gl case fails on Metal (the same one with and without the debug layer in run 2).
          run render_gl_plain 3600 "$B/tests/render_gl/test_render_gl"
          export MTL_DEBUG_LAYER=1
          run render_gl_debuglayer 3600 "$B/tests/render_gl/test_render_gl"
          for f in out/render_gl_*.log; do echo "--- $f"; grep -B12 -A6 "is NOT correct\|ERROR: \|CRASHED" "$f" | head -80; done | tee out/failures.txt
          { echo '### Metal render_gl'; echo '```'; cat out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-debuglayer-results
          path: out
          retention-days: 14
